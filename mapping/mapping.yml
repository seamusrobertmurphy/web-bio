- title: '<span style="color: rgb(96, 165, 250); font-weight: 600;">Site Maps:</span>'
  path: https://seamusrobertmurphy.quarto.pub/map-templates/site-map.html
  image: ../assets/PNG/01-site-draft.png   
  description: "Collection of site maps, including static maps designed for field operations teams and interactive maps for collective review of waypoints or target locations. Static maps were derived to ensure customizable basemaps, project boundary delineation, geographic coordinate grid and graticule cross-hairs. Legends were added using tmap functions that ensure minimum cartographic features are rendered including scale bars and north arrows."
  date: 2024-12-15

- title: '<span style="color: rgb(96, 165, 250); font-weight: 600;">Population Maps:</span>'
  path: https://seamusrobertmurphy.quarto.pub/map-templates/population-map.html
  image: ../assets/PNG/04-population-map.png
  description: "Robust template and data source for rapid population density and demographic analysis useful for community impact assessments and initial stakeholder mapping. Visualizing census data and human settlements, population maps provide key tools at initial stages or during ex-post project evaluations."
  date: 2024-11-20

- title: '<span style="color: rgb(96, 165, 250); font-weight: 600;">Watershed Maps:</span>'
  path: https://seamusrobertmurphy.quarto.pub/map-templates/watershed-map.html
  image: ../assets/PNG/06-watershed-3D.png
  description: "Three-dimensional topographic delineation of the surrounding immediate watershed sub-basin. Watershed mapping provides essential resources for hydrological analysis of catchment dynamics, shared boundary, and flow direction analysis. This workflow includes tools for drainage area calculations, outlet point identification, stream network and contour visualizations, which are used to inform environmental impact studies and risk assessment between upstream and downstream features."
  date: 2024-11-28

- title: '<span style="color: rgb(96, 165, 250); font-weight: 600;">Riparian Maps:</span>'
  path: https://seamusrobertmurphy.quarto.pub/map-templates/stream-map.html
  image: https://raw.githubusercontent.com/seamusrobertmurphy/map-templates/refs/heads/main/assets/MAP/stream_map_high_b.png
  description: >
    Riparian map including DEM conditioning by breaching and filling depressions and flats, and stream 
    delineation using flow direction and accumulation rendered in 3D over elevation data designed 
    to support wetland conservation, streambank stabilization projects, and riparian vegetation
    management strategies.
  date: 2025-09-20

- title: '<span style="color: rgb(96, 165, 250); font-weight: 600;">Climate Maps:</span>'
  path: https://seamusrobertmurphy.quarto.pub/map-templates/climate-map.html
  image: https://raw.githubusercontent.com/seamusrobertmurphy/forest-fire-risk-cffdrs/main/assets/PNG/temp.png
  description: >
    Climate maps featuring mean daily temperature (°C), precipitation (mm³/day), relative humidity (%), 
    and wind speed (m/s) derived from Environment and Climate Change Canada weather station data using Inverse 
    Distance Weighting interpolation. Station data aggregated over specified periods and spatially interpolated 
    to continuous raster surfaces, supporting wildfire risk assessment, agricultural planning, environmental 
    monitoring, and climate impact studies for operational decision-making.
  categories: [Mapping, Fieldwork, Operations]
  date: 2025-08-01

- title: '<span style="color: rgb(96, 165, 250); font-weight: 600;">Topography Maps:</span>'
  path: ./topo-map.qmd
  image: https://raw.githubusercontent.com/seamusrobertmurphy/map-templates/refs/heads/main/assets/MAP/aspect_chilwa_2d.png
  description: >
    Topographic maps featuring classified slope percentages and cardinal aspects derived from conditioned DEM data. 
    These maps support terrain assessment, erosion risk evaluation, slope stability analysis, and 
    site suitability planning for infrastructure development, agricultural practices, and environmental 
    management operations.
  categories: [Mapping, Fieldwork, Operations]
  date: 2025-08-01
  
- title: '<span style="color: rgb(96, 165, 250); font-weight: 600;">Mapping</span> Templates: Site Visualization'
  date: 2024-12-04
  path: https://seamusrobertmurphy.quarto.pub/map-templates/
  description: "Collection of every-day maps used operational site mapping designed to support fieldwork and environmental analysis activities. This resource includes topographic, hydrographic, demographic, and watershed cartographic tools. Site maps were designed for supporting boundary identification and field access, with Locator inset maps also provided for helping users within quickly orientate themselves within local and national landscapes. A final section was added showcasing 3-D mapping of watershed delineation and topopgrahy useful for environmental impact assessments between upstream and downstream sites. These templates serve as practical tools for researchers, environmental analysts, and field professionals requiring standardized every-day mapping solutions for site orientation and operational planning."
  image: https://raw.githubusercontent.com/seamusrobertmurphy/web-bio/refs/heads/main/assets/PNG/07-map-grid.png
  categories: [Mapping, Fieldwork, Operations]
  
- title: '<span style="color: rgb(96, 165, 250); font-weight: 600;">Wetlands</span> Mapping: SAR & Landsat Workflows'
  date: 2024-06-15
  description: "Framework for mapping endorheic wetland dynamics, combining Sentinel-1 InSAR processing with Landsat time series analysis (1994-2015), using water extraction indices (NDWI, MNDWI, AWEIsh) and spectral mixture analysis for sub-pixel water detection. Community mapping components include key informant interviews, focus group discussions, and rapid participatory appraisals capturing local ecological knowledge of seasonal fishing migration patterns and traditional resource management practices."
  path: https://rpubs.com/seamusmurphy/mapping-endorheic-wetland-dynamics
  image: ../assets/PNG/Wetland-Mapping-icon-b.png  

- title: '<span style="color: rgb(96, 165, 250); font-weight: 600;">GeoODK</span> Survey: Open Source Build'
  date: 2018-02-05
